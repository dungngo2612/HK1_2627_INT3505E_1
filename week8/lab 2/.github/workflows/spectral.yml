name: OpenAPI lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  spectral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @stoplight/spectral-cli@6.17.1 lint openapi.yaml --ruleset .spectral.yml
