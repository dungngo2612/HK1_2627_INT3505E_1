[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "week7-product-api"
version = "1.0.0"
description = "Bai tap SOA buoi 7: Flask backend service"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0.36,<2.1",
    "Flask-Migrate>=4.1,<5",
    "flask-smorest>=0.46,<0.48",
    "marshmallow>=4,<5",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<26",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["product_api*", "bai1_product_api*", "bai2_orders*", "bai4_healthcheck*"]

[tool.pytest.ini_options]
testpaths = ["bai5_pytest"]
addopts = "-ra"
